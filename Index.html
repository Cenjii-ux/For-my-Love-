<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 🌸</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background: radial-gradient(
                circle at center,
                #18202b,
                #070a10 70%
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene {
            position: relative;
            width: 300px;
            height: 450px;
        }

        /* =========================
           STEM
        ========================= */

        .stem {
            position: absolute;

            bottom: 45px;
            left: 50%;

            width: 7px;
            height: 0;

            background: linear-gradient(
                to right,
                #245c36,
                #5bbf70,
                #245c36
            );

            border-radius: 10px;

            transform: translateX(-50%);

            animation: growStem 2s ease-out forwards;
        }

        /* =========================
           FLOWER
        ========================= */

        .flower {
            position: absolute;

            left: 50%;
            top: 70px;

            width: 180px;
            height: 180px;

            transform: translateX(-50%);

            opacity: 0;

            animation: flowerAppear 1s 2s forwards;
        }

        /* =========================
           PETAL CONTAINER
        ========================= */

        .petal {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 55px;
            height: 100px;

            background: linear-gradient(
                to top,
                #b92d69,
                #ff6fae
            );

            border-radius:
                50% 50%
                45% 45%;

            transform-origin: 50% 100%;

            /* CLOSED POSITION */
            transform:
                translate(-50%, -100%)
                rotate(0deg)
                scale(0.15);

            opacity: 0;

            box-shadow:
                0 0 15px rgba(255, 105, 170, 0.3);
        }

        /*
           Each petal gets a different
           final rotation.
        */

        .p1 {
            --rotation: 0deg;
        }

        .p2 {
            --rotation: 72deg;
        }

        .p3 {
            --rotation: 144deg;
        }

        .p4 {
            --rotation: 216deg;
        }

        .p5 {
            --rotation: 288deg;
        }

        /*
           BLOOM!
        */

        .flower .petal {
            animation:
                bloom 1.8s cubic-bezier(.17,.67,.32,1.3)
                forwards;
        }

        .p1 {
            animation-delay: 2.2s !important;
        }

        .p2 {
            animation-delay: 2.4s !important;
        }

        .p3 {
            animation-delay: 2.6s !important;
        }

        .p4 {
            animation-delay: 2.8s !important;
        }

        .p5 {
            animation-delay: 3s !important;
        }

        /* =========================
           FLOWER CENTER
        ========================= */

        .center {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 48px;
            height: 48px;

            transform:
                translate(-50%, -50%)
                scale(0);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 35%,
                    #fff3a0,
                    #ffd13d 55%,
                    #d99b00
                );

            z-index: 10;

            box-shadow:
                0 0 20px #ffd84d;

            animation:
                centerBloom 1s 4.2s
                cubic-bezier(.17,.67,.32,1.3)
                forwards;
        }

        /* =========================
           LEAVES
        ========================= */

        .leaf {
            position: absolute;

            width: 65px;
            height: 30px;

            background: #3d9b55;

            border-radius: 100% 0 100% 0;

            bottom: 150px;

            opacity: 0;

            animation:
                leafAppear 1s 2s forwards;
        }

        .leaf.left {
            left: 88px;
            transform: rotate(-30deg);
        }

        .leaf.right {
            right: 88px;
            transform:
                scaleX(-1)
                rotate(-30deg);
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            position: absolute;

            bottom: 10px;

            width: 100%;

            text-align: center;

            font-family: Arial, sans-serif;

            color: white;

            opacity: 0;

            animation:
                messageAppear 1.5s 6s
                forwards;
        }

        .message h2 {
            font-weight: normal;
            letter-spacing: 3px;
            font-size: 22px;
        }

        .message p {
            margin-top: 8px;
            font-size: 13px;
            opacity: .7;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes growStem {

            0% {
                height: 0;
            }

            100% {
                height: 230px;
            }
        }

        @keyframes flowerAppear {

            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes bloom {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, -100%)
                    rotate(0deg)
                    scale(0.15);
            }

            20% {
                opacity: 1;
            }

            100% {
                opacity: 1;

                /*
                   THIS is the important part:
                   petals rotate outward.
                */

                transform:
                    translate(-50%, -100%)
                    rotate(var(--rotation))
                    scale(1);
            }
        }

        @keyframes centerBloom {

            0% {
                transform:
                    translate(-50%, -50%)
                    scale(0);
            }

            70% {
                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }

        @keyframes leafAppear {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes messageAppear {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>

    <div class="scene">

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="flower">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>

            <div class="center"></div>

        </div>

        <div class="message">

            <h2>For You 🌸</h2>

            <p>
                Some things are worth waiting for.
            </p>

        </div>

    </div>

</body>
  </html>
